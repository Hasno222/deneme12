<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D & 3D İç Mekan Tasarım Aracı</title>
    <!-- Three.js ve OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: #1e1e1e; color: #fff; }
        
        /* Üst Menü / Sekmeler */
        header { height: 60px; background: #2d2d2d; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #444; }
        .tabs { display: flex; gap: 10px; }
        .tab-btn { background: #3d3d3d; border: none; color: #aaa; padding: 10px 20px; font-size: 14px; cursor: pointer; border-radius: 4px; transition: 0.3s; }
        .tab-btn.active { background: #007acc; color: #fff; font-weight: bold; }
        .info { font-size: 13px; color: #888; }

        /* Ana İçerik Alanı */
        .content { flex: 1; position: relative; overflow: hidden; }
        .view-pane { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        .view-pane.active { display: block; }

        canvas { display: block; background: #121212; cursor: crosshair; }

        /* Düzenleme Paneli (Modal) */
        #property-panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #252526; border: 1px solid #454545; padding: 25px; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); z-index: 1000; width: 320px; display: none;
        }
        #property-panel h3 { margin-bottom: 15px; font-size: 16px; color: #007acc; border-bottom: 1px solid #3d3d3d; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #ccc; }
        .form-group select, .form-group input { width: 100%; padding: 8px; background: #3c3c3c; border: 1px solid #555; color: #fff; border-radius: 4px; }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-primary { background: #007acc; color: #fff; }
        .btn-secondary { background: #555; color: #fff; }

        /* Bilgilendirme Overlay */
        .help-overlay {
            position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7);
            padding: 10px 15px; border-radius: 5px; font-size: 12px; pointer-events: none; border: 1px solid #444;
        }
    </style>
</head>
<body>

    <header>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('2d')">2D Çizim Alanı</button>
            <button class="tab-btn" onclick="switchTab('3d')">3D Ön İzleme</button>
        </div>
        <div class="info">İpucu: 2D'de tıkla ve sürükleyerek çizgi çek.</div>
    </header>

    <div class="content">
        <!-- 2D Canvas Görünümü -->
        <div id="pane-2d" class="view-pane active">
            <canvas id="canvas2d"></canvas>
            <div class="help-overlay">Sol tık basılı tutup sürükleyerek eleman çizin. Son bitiş noktası yeni çizime otomatik bağlanır.</div>
        </div>

        <!-- 3D Three.js Görünümü -->
        <div id="pane-3d" class="view-pane">
            <div id="canvas3d-container" style="width:100%; height:100%;"></div>
        </div>
    </div>

    <!-- Düzenleme Paneli -->
    <div id="property-panel">
        <h3>Eleman Özellikleri</h3>
        <div class="form-group">
            <label>Eleman Tipi</label>
            <select id="elem-type" onchange="toggleElementOptions()">
                <option value="wall">Duvar</option>
                <option value="door">Kapı</option>
                <option value="window">Pencere</option>
                <option value="column">Kolon</option>
            </select>
        </div>
        <div class="form-group" id="group-thickness">
            <label>Kalınlık / Genişlik (cm)</label>
            <input type="number" id="elem-thickness" value="20" min="5" max="100">
        </div>
        <div class="form-group" id="group-door-dir" style="display:none;">
            <label>Açılış Yönü</label>
            <select id="elem-door-dir">
                <option value="in-left">İçe (Sol)</option>
                <option value="in-right">İçe (Sağ)</option>
                <option value="out-left">Dışa (Sol)</option>
                <option value="out-right">Dışa (Sağ)</option>
            </select>
        </div>
        <div class="form-actions">
            <button class="btn btn-secondary" onclick="cancelElement()">İptal Et</button>
            <button class="btn btn-primary" onclick="saveElement()">Kaydet & Ekle</button>
        </div>
    </div>

    <script>
        // --- Global Değişkenler ---
        let currentTab = '2d';
        let elements = []; // Tüm mimari elemanlar
        let currentDrawing = null;
        let lastEndPoint = null; // Otomatik kenetlenme (snapping) için son nokta

        const canvas2d = document.getElementById('canvas2d');
        const ctx = canvas2d.getContext('2d');

        // Canvas Boyutlandırma
        function resizeCanvas() {
            canvas2d.width = canvas2d.parentElement.clientWidth;
            canvas2d.height = canvas2d.parentElement.clientHeight;
            draw2D();
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', () => { resizeCanvas(); init3D(); });

        // Sekme Değiştirme
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));

            if (tab === '2d') {
                document.querySelector('.tabs button:nth-child(1)').classList.add('active');
                document.getElementById('pane-2d').classList.add('active');
                resizeCanvas();
            } else {
                document.querySelector('.tabs button:nth-child(2)').classList.add('active');
                document.getElementById('pane-3d').classList.add('active');
                update3DScene();
            }
        }

        // --- 2D Çizim Mantığı ---
        let isDrawing = false;
        let tempStart = null;
        let tempEnd = null;

        canvas2d.addEventListener('mousedown', (e) => {
            if (currentTab !== '2d') return;
            const rect = canvas2d.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Eğer daha önceden çizilmiş bir nokta varsa ve çok uzakta değilsek, oradan başlat (Snap)
            if (lastEndPoint && Math.hypot(x - lastEndPoint.x, y - lastEndPoint.y) < 25) {
                tempStart = { x: lastEndPoint.x, y: lastEndPoint.y };
            } else {
                tempStart = { x, y };
            }
            isDrawing = true;
        });

        canvas2d.addEventListener('mousemove', (e) => {
            if (!isDrawing || currentTab !== '2d') return;
            const rect = canvas2d.getBoundingClientRect();
            tempEnd = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            draw2D();
        });

        canvas2d.addEventListener('mouseup', (e) => {
            if (!isDrawing || currentTab !== '2d') return;
            isDrawing = false;
            const rect = canvas2d.getBoundingClientRect();
            tempEnd = { x: e.clientX - rect.left, y: e.clientY - rect.top };

            // Çok kısa çizimleri engelle
            if (Math.hypot(tempEnd.x - tempStart.x, tempEnd.y - tempStart.y) > 10) {
                // Geçici çizimi kaydet ve paneli aç
                currentDrawing = {
                    x1: tempStart.x, y1: tempStart.y,
                    x2: tempEnd.x, y2: tempEnd.y,
                    type: 'wall', thickness: 20, doorDir: 'in-left'
                };
                openPropertyPanel();
            } else {
                draw2D();
            }
        });

        function draw2D() {
            ctx.clearRect(0, 0, canvas2d.width, canvas2d.height);

            // Grid Çizgileri (Hafif Arka Plan)
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < canvas2d.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas2d.height); ctx.stroke();
            }
            for (let y = 0; y < canvas2d.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas2d.width, y); ctx.stroke();
            }

            // Kayıtlı Elemanları Çiz
            elements.forEach(el => {
                drawElement2D(el);
            });

            // Aktif çizilen geçici çizgi
            if (isDrawing && tempStart && tempEnd) {
                ctx.strokeStyle = '#007acc';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(tempStart.x, tempStart.y);
                ctx.lineTo(tempEnd.x, tempEnd.y);
                ctx.stroke();
            }

            // Snap Noktası İşareti
            if (lastEndPoint) {
                ctx.fillStyle = '#00ff88';
                ctx.beginPath();
                ctx.arc(lastEndPoint.x, lastEndPoint.y, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawElement2D(el) {
            ctx.beginPath();
            ctx.moveTo(el.x1, el.y1);
            ctx.lineTo(el.x2, el.y2);

            if (el.type === 'wall') {
                ctx.strokeStyle = '#d4d4d4';
                ctx.lineWidth = Math.max(4, el.thickness / 2);
            } else if (el.type === 'door') {
                ctx.strokeStyle = '#ff9800';
                ctx.lineWidth = 4;
            } else if (el.type === 'window') {
                ctx.strokeStyle = '#00bcd4';
                ctx.lineWidth = 4;
            } else if (el.type === 'column') {
                ctx.strokeStyle = '#e91e63';
                ctx.lineWidth = Math.max(8, el.thickness);
            }
            ctx.stroke();
        }

        // --- Düzenleme Paneli İşlemleri ---
        function openPropertyPanel() {
            document.getElementById('property-panel').style.display = 'block';
            document.getElementById('elem-type').value = 'wall';
            document.getElementById('elem-thickness').value = '20';
            toggleElementOptions();
        }

        function toggleElementOptions() {
            const type = document.getElementById('elem-type').value;
            document.getElementById('group-door-dir').style.display = (type === 'door') ? 'block' : 'none';
        }

        function cancelElement() {
            document.getElementById('property-panel').style.display = 'none';
            currentDrawing = null;
            draw2D();
        }

        function saveElement() {
            if (!currentDrawing) return;
            currentDrawing.type = document.getElementById('elem-type').value;
            currentDrawing.thickness = parseFloat(document.getElementById('elem-thickness').value) || 20;
            currentDrawing.doorDir = document.getElementById('elem-door-dir').value;

            elements.push(currentDrawing);
            lastEndPoint = { x: currentDrawing.x2, y: currentDrawing.y2 }; // Son noktayı güncelle (yapışma için)

            document.getElementById('property-panel').style.display = 'none';
            currentDrawing = null;
            draw2D();
        }

        // --- 3D Three.js Motoru ---
        let scene, camera, renderer, controls;

        function init3D() {
            const container = document.getElementById('canvas3d-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x181818);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 2000);
            camera.position.set(0, 400, 400);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Işıklar
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(200, 500, 300);
            scene.add(dirLight);

            // Zemin Izgarası
            const gridHelper = new THREE.GridHelper(1000, 50, 0x444444, 0x222222);
            gridHelper.position.y = -1;
            scene.add(gridHelper);

            // Döngü
            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            controls.update();
            renderer.render(scene, camera);
        }

        // 2D Elemanları 3D Model Nesnelerine Dönüştür
        function update3DScene() {
            // Eski 3D yapı elemanlarını temizle (Grid ve Işıklar hariç)
            const removeList = [];
            scene.children.forEach(child => {
                if (child.isMesh && !child.geometry.type.includes('Grid')) {
                    removeList.push(child);
                }
            });
            removeList.forEach(c => scene.remove(c));

            // Merkezleme dönüşümü (Canvas koordinatlarını 3D dünya merkezine hizalama için offset)
            const offsetX = canvas2d.width / 2;
            const offsetZ = canvas2d.height / 2;

            elements.forEach(el => {
                const x1 = el.x1 - offsetX;
                const z1 = el.y1 - offsetZ;
                const x2 = el.x2 - offsetX;
                const z2 = el.y2 - offsetZ;

                const length = Math.hypot(x2 - x1, z2 - z1);
                if (length === 0) return;

                const angle = Math.atan2(z2 - z1, x2 - x1);
                const wallHeight = 250; // Duvar yüksekliği (cm)
                const thickness = el.thickness || 20;

                let color = 0xdddddd;
                if (el.type === 'door') color = 0xdc7633;
                if (el.type === 'window') color = 0x5dade2;
                if (el.type === 'column') color = 0xaf7ac5;
                if (el.type === 'wall') color = 0x566573;

                const geometry = new THREE.BoxGeometry(length, wallHeight, thickness);
                const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
                const mesh = new THREE.Mesh(geometry, material);

                // Konumlandırma
                mesh.position.set((x1 + x2) / 2, wallHeight / 2, (z1 + z2) / 2);
                mesh.rotation.y = -angle;

                scene.add(mesh);
            });

            // Boyut güncellemesi
            const container = document.getElementById('canvas3d-container');
            renderer.setSize(container.clientWidth, container.clientHeight);
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
        }
    </script>
</body>
</html>
