<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D & 3D Pro İç Mekan Tasarım Aracı</title>
    <!-- Three.js ve OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        body { width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: #1e1e1e; color: #fff; }
        
        /* Üst Menü / Sekmeler */
        header { height: 60px; background: #2d2d2d; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #444; flex-shrink: 0; z-index: 10; }
        .tabs { display: flex; gap: 8px; }
        .tab-btn { background: #3d3d3d; border: none; color: #aaa; padding: 8px 15px; font-size: 13px; cursor: pointer; border-radius: 4px; transition: 0.3s; }
        .tab-btn.active { background: #007acc; color: #fff; font-weight: bold; }
        .toolbar-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .tool-btn { background: #444; border: none; color: #fff; padding: 8px 12px; font-size: 12px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 5px; }
        .tool-btn.active-tool { background: #28a745; }

        /* Ana İçerik Alanı */
        .content { flex: 1; position: relative; overflow: hidden; }
        .view-pane { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        .view-pane.active { display: block; }
        canvas { display: block; background: #121212; width: 100%; height: 100%; cursor: crosshair; }

        /* 2D Ekran Kontrolleri (Zoom & Fit) */
        .canvas-controls { position: absolute; right: 15px; top: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
        .canvas-controls button { background: rgba(50,50,50,0.8); border: 1px solid #555; color: white; border-radius: 4px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .canvas-controls button:hover { background: #007acc; }

        /* Düzenleme Paneli (Modal) */
        #property-panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #252526; border: 1px solid #454545; padding: 20px; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); z-index: 1000; width: 90%; max-width: 320px; display: none;
        }
        #property-panel h3 { margin-bottom: 15px; font-size: 16px; color: #007acc; border-bottom: 1px solid #3d3d3d; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #ccc; }
        .form-group select, .form-group input { width: 100%; padding: 10px; background: #3c3c3c; border: 1px solid #555; color: #fff; border-radius: 4px; font-size: 14px; }
        .form-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-primary { background: #007acc; color: #fff; }
        .btn-secondary { background: #555; color: #fff; }
        .btn-danger { background: #d9534f; color: #fff; }

        /* Bilgilendirme Overlay */
        .help-overlay {
            position: absolute; bottom: 15px; left: 15px; right: 15px; background: rgba(0,0,0,0.8);
            padding: 8px 12px; border-radius: 5px; font-size: 11px; pointer-events: none; border: 1px solid #444; text-align: center; z-index: 5;
        }
    </style>
</head>
<body>

    <header>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('2d')">2D Çizim</button>
            <button class="tab-btn" onclick="switchTab('3d')">3D Görünüm</button>
        </div>
        <div class="toolbar-btns">
            <button class="tool-btn active-tool" id="btn-mode-draw" onclick="setMode('draw')">✏️ Çiz</button>
            <button class="tool-btn" id="btn-mode-select" onclick="setMode('select')">👆 Seç/Düzenle</button>
            <button class="tool-btn" id="btn-mode-pan" onclick="setMode('pan')">✋ Kaydır</button>
        </div>
    </header>

    <div class="content">
        <!-- 2D Canvas Görünümü -->
        <div id="pane-2d" class="view-pane active">
            <div class="canvas-controls">
                <button onclick="zoomIn()" title="Yakınlaş">+</button>
                <button onclick="zoomOut()" title="Uzaklaş">-</button>
                <button onclick="fitToScreen()" title="Ekrana Sığdır" style="font-size: 12px;">[ ]</button>
            </div>
            <canvas id="canvas2d"></canvas>
            <div class="help-overlay" id="help-text">Mod: Ekrana dokun, ölçü gir ve duvarı ekle.</div>
        </div>

        <!-- 3D Three.js Görünümü -->
        <div id="pane-3d" class="view-pane">
            <div id="canvas3d-container" style="width:100%; height:100%;"></div>
        </div>
    </div>

    <!-- Düzenleme Paneli -->
    <div id="property-panel">
        <h3 id="panel-title">Eleman Özellikleri</h3>
        <div class="form-group">
            <label>Eleman Tipi</label>
            <select id="elem-type" onchange="toggleElementOptions()">
                <option value="wall">Duvar</option>
                <option value="door">Kapı</option>
                <option value="window">Pencere</option>
                <option value="column">Kolon</option>
            </select>
        </div>
        <div class="form-group" id="group-length">
            <label>Uzunluk (cm)</label>
            <input type="number" id="elem-length" value="200" min="10" max="5000">
        </div>
        <div class="form-group" id="group-angle">
            <label>Açı (Derece: 0=Sağ, 90=Aşağı, 180=Sol, 270=Yukarı)</label>
            <input type="number" id="elem-angle" value="0" min="0" max="360">
        </div>
        <div class="form-group" id="group-thickness">
            <label>Kalınlık / Genişlik (cm)</label>
            <input type="number" id="elem-thickness" value="20" min="5" max="200">
        </div>
        <div class="form-group" id="group-door-dir" style="display:none;">
            <label>Açılış Yönü</label>
            <select id="elem-door-dir">
                <option value="in-left">İçe (Sol)</option>
                <option value="in-right">İçe (Sağ)</option>
                <option value="out-left">Dışa (Sol)</option>
                <option value="out-right">Dışa (Sağ)</option>
            </select>
        </div>
        <div class="form-actions">
            <button class="btn btn-danger" id="btn-delete" onclick="deleteSelectedElement()" style="display:none;">Sil</button>
            <div style="display:flex; gap:10px; margin-left:auto;">
                <button class="btn btn-secondary" onclick="cancelElement()">İptal</button>
                <button class="btn btn-primary" onclick="saveElement()">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        // --- Durum ve Değişkenler ---
        let currentTab = '2d';
        let currentMode = 'draw'; // 'draw', 'select', 'pan'
        let elements = [];
        let startPoint = null;
        let lastEndPoint = null;
        let selectedElementIndex = null;
        
        let lastUsedThickness = 20; // Kalınlık hafızası

        // Kamera (Pan & Zoom) Değişkenleri
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isPanning = false;
        let isDraggingElement = false;
        let dragOffset = { x: 0, y: 0 };
        let panStartMouse = { x: 0, y: 0 };
        let panStartOffset = { x: 0, y: 0 };

        const canvas2d = document.getElementById('canvas2d');
        const ctx = canvas2d.getContext('2d');

        function resizeCanvas() {
            canvas2d.width = canvas2d.parentElement.clientWidth;
            canvas2d.height = canvas2d.parentElement.clientHeight;
            draw2D();
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', () => { resizeCanvas(); fitToScreen(); init3D(); });

        // --- Kamera ve Görünüm Kontrolleri ---
        function zoomIn() { scale *= 1.2; draw2D(); }
        function zoomOut() { scale /= 1.2; draw2D(); }
        function fitToScreen() {
            if (elements.length === 0) { scale = 1; offsetX = 0; offsetY = 0; draw2D(); return; }
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            elements.forEach(el => {
                minX = Math.min(minX, el.x1, el.x2);
                maxX = Math.max(maxX, el.x1, el.x2);
                minY = Math.min(minY, el.y1, el.y2);
                maxY = Math.max(maxY, el.y1, el.y2);
            });
            const padding = 100;
            const w = maxX - minX || 100;
            const h = maxY - minY || 100;
            const scaleX = (canvas2d.width - padding) / w;
            const scaleY = (canvas2d.height - padding) / h;
            scale = Math.min(scaleX, scaleY);
            if (scale > 2) scale = 2; // Maksimum yakınlaşma limiti
            offsetX = (canvas2d.width - w * scale) / 2 - minX * scale;
            offsetY = (canvas2d.height - h * scale) / 2 - minY * scale;
            draw2D();
        }

        // Fare Tekerleği ile Zoom
        canvas2d.addEventListener('wheel', (e) => {
            if (currentTab !== '2d') return;
            e.preventDefault();
            const zoomFactor = 1.1;
            const rect = canvas2d.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const newScale = e.deltaY < 0 ? scale * zoomFactor : scale / zoomFactor;
            
            // Farenin olduğu noktaya doğru zoom yap
            offsetX = mouseX - (mouseX - offsetX) * (newScale / scale);
            offsetY = mouseY - (mouseY - offsetY) * (newScale / scale);
            scale = newScale;
            draw2D();
        }, { passive: false });

        // --- Mod Değişimi ---
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));

            if (tab === '2d') {
                document.querySelector('.tabs button:nth-child(1)').classList.add('active');
                document.getElementById('pane-2d').classList.add('active');
                resizeCanvas();
            } else {
                document.querySelector('.tabs button:nth-child(2)').classList.add('active');
                document.getElementById('pane-3d').classList.add('active');
                update3DScene();
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-draw').classList.toggle('active-tool', mode === 'draw');
            document.getElementById('btn-mode-select').classList.toggle('active-tool', mode === 'select');
            document.getElementById('btn-mode-pan').classList.toggle('active-tool', mode === 'pan');
            
            const helpText = document.getElementById('help-text');
            if (mode === 'draw') helpText.innerText = "Mod: Ekrana dokun, ölçü gir ve eleman ekle.";
            else if (mode === 'select') helpText.innerText = "Mod: Bir elemana dokunarak sürükleyebilir veya tıklayıp düzenleyebilirsin.";
            else helpText.innerText = "Mod: Ekranı sürükleyerek kaydır (Pan).";
        }

        // Gerçek koordinatları tuvalin mantıksal (ölçeklenmiş) koordinatlarına çevirme
        function getLogicalPos(e) {
            const rect = canvas2d.getBoundingClientRect();
            let cx, cy;
            if (e.touches && e.touches.length > 0) {
                cx = e.touches[0].clientX; cy = e.touches[0].clientY;
            } else {
                cx = e.clientX; cy = e.clientY;
            }
            return {
                rawX: cx, rawY: cy, // Pan için ham değerler
                x: (cx - rect.left - offsetX) / scale,
                y: (cy - rect.top - offsetY) / scale
            };
        }

        // --- Etkileşimler (Mouse / Touch) ---
        function handleStart(e) {
            if (currentTab !== '2d') return;
            const pos = getLogicalPos(e);

            if (currentMode === 'pan') {
                isPanning = true;
                panStartMouse = { x: pos.rawX, y: pos.rawY };
                panStartOffset = { x: offsetX, y: offsetY };
                canvas2d.style.cursor = 'grabbing';
            } 
            else if (currentMode === 'draw') {
                if (lastEndPoint && Math.hypot(pos.x - lastEndPoint.x, pos.y - lastEndPoint.y) < 35/scale) {
                    startPoint = { x: lastEndPoint.x, y: lastEndPoint.y };
                } else {
                    startPoint = { x: pos.x, y: pos.y };
                }
                openPropertyPanelForNew();
            } 
            else if (currentMode === 'select') {
                selectedElementIndex = findElementAt(pos.x, pos.y);
                if (selectedElementIndex !== null) {
                    isDraggingElement = true;
                    const el = elements[selectedElementIndex];
                    dragOffset.x = pos.x - el.x1;
                    dragOffset.y = pos.y - el.y1;
                }
            }
            e.preventDefault();
        }

        function handleMove(e) {
            if (currentTab !== '2d') return;
            const pos = getLogicalPos(e);

            if (isPanning) {
                offsetX = panStartOffset.x + (pos.rawX - panStartMouse.x);
                offsetY = panStartOffset.y + (pos.rawY - panStartMouse.y);
                draw2D();
            } 
            else if (isDraggingElement && selectedElementIndex !== null) {
                const el = elements[selectedElementIndex];
                const length = Math.hypot(el.x2 - el.x1, el.y2 - el.y1);
                const angle = Math.atan2(el.y2 - el.y1, el.x2 - el.x1);

                el.x1 = pos.x - dragOffset.x;
                el.y1 = pos.y - dragOffset.y;
                el.x2 = el.x1 + Math.cos(angle) * length;
                el.y2 = el.y1 + Math.sin(angle) * length;
                draw2D();
            }
            e.preventDefault();
        }

        function handleEnd(e) {
            if (isPanning) {
                isPanning = false;
                canvas2d.style.cursor = 'crosshair';
            }
            if (isDraggingElement) {
                isDraggingElement = false;
                if (selectedElementIndex !== null) openPropertyPanelForEdit(selectedElementIndex);
            }
            e.preventDefault();
        }

        canvas2d.addEventListener('mousedown', handleStart);
        canvas2d.addEventListener('mousemove', handleMove);
        canvas2d.addEventListener('mouseup', handleEnd);

        canvas2d.addEventListener('touchstart', handleStart, { passive: false });
        canvas2d.addEventListener('touchmove', handleMove, { passive: false });
        canvas2d.addEventListener('touchend', handleEnd, { passive: false });

        function findElementAt(x, y) {
            for (let i = elements.length - 1; i >= 0; i--) {
                const el = elements[i];
                const dist = distToSegment({x, y}, {x: el.x1, y: el.y1}, {x: el.x2, y: el.y2});
                if (dist < 20 / scale) return i; // Zooma göre tolerans
            }
            return null;
        }

        function distToSegment(p, p1, p2) {
            const l2 = Math.hypot(p2.x - p1.x, p2.y - p1.y) ** 2;
            if (l2 === 0) return Math.hypot(p.x - p1.x, p.y - p1.y);
            let t = ((p.x - p1.x) * (p2.x - p1.x) + (p.y - p1.y) * (p2.y - p1.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (p1.x + t * (p2.x - p1.x)), p.y - (p1.y + t * (p2.y - p1.y)));
        }

        // --- 2D Çizim Motoru ---
        function draw2D() {
            ctx.clearRect(0, 0, canvas2d.width, canvas2d.height);
            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            // Sonsuz Grid Görünümü
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1 / scale; // Yakınlaşınca çizgiler kalınlaşmasın
            const gridSize = 40;
            const startX = -offsetX / scale, endX = (canvas2d.width - offsetX) / scale;
            const startY = -offsetY / scale, endY = (canvas2d.height - offsetY) / scale;
            
            for (let x = Math.floor(startX/gridSize)*gridSize; x < endX; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, endY); ctx.stroke();
            }
            for (let y = Math.floor(startY/gridSize)*gridSize; y < endY; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(endX, y); ctx.stroke();
            }

            // Elemanları Çiz
            elements.forEach((el, index) => drawElement2D(el, index === selectedElementIndex));

            // Snap (Otomatik Yakalama) Noktası Göstergesi
            if (lastEndPoint) {
                ctx.fillStyle = '#00ff88';
                ctx.beginPath();
                ctx.arc(lastEndPoint.x, lastEndPoint.y, 6 / scale, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function drawElement2D(el, isSelected) {
            ctx.beginPath();
            ctx.moveTo(el.x1, el.y1);
            ctx.lineTo(el.x2, el.y2);

            if (isSelected) {
                ctx.strokeStyle = '#ffeb3b';
                ctx.lineWidth = 6 / scale;
            } else {
                if (el.type === 'wall') { ctx.strokeStyle = '#d4d4d4'; ctx.lineWidth = Math.max(2, el.thickness / 2); }
                else if (el.type === 'door') { ctx.strokeStyle = '#ff9800'; ctx.lineWidth = 4 / scale; }
                else if (el.type === 'window') { ctx.strokeStyle = '#00bcd4'; ctx.lineWidth = 4 / scale; }
                else if (el.type === 'column') { ctx.strokeStyle = '#e91e63'; ctx.lineWidth = el.thickness; }
            }
            ctx.stroke();

            // Ölçü Göstergesi
            const length = Math.round(Math.hypot(el.x2 - el.x1, el.y2 - el.y1));
            const midX = (el.x1 + el.x2) / 2;
            const midY = (el.y1 + el.y2) / 2;
            ctx.fillStyle = '#aaa';
            ctx.font = (12 / scale) + 'px sans-serif';
            ctx.fillText(length + 'cm', midX + (5/scale), midY - (5/scale));
        }

        // --- Panel İşlemleri (Tüm Değerler Düzenlenebilir) ---
        function openPropertyPanelForNew() {
            selectedElementIndex = null;
            document.getElementById('panel-title').innerText = "Yeni Eleman Ekle";
            document.getElementById('btn-delete').style.display = 'none';

            document.getElementById('elem-type').value = 'wall';
            document.getElementById('elem-length').value = '200';
            document.getElementById('elem-angle').value = '0';
            document.getElementById('elem-thickness').value = lastUsedThickness; // Kalınlık hafızası kullanıldı
            
            toggleElementOptions();
            document.getElementById('property-panel').style.display = 'block';
        }

        function openPropertyPanelForEdit(index) {
            selectedElementIndex = index;
            const el = elements[index];
            document.getElementById('panel-title').innerText = "Elemanı Düzenle (Tüm Değerler)";
            document.getElementById('btn-delete').style.display = 'block';

            // Mevcut uzunluk ve açıyı hesapla
            const length = Math.round(Math.hypot(el.x2 - el.x1, el.y2 - el.y1));
            let angleDeg = Math.round((Math.atan2(el.y2 - el.y1, el.x2 - el.x1) * 180) / Math.PI);
            if (angleDeg < 0) angleDeg += 360;

            document.getElementById('elem-type').value = el.type;
            document.getElementById('elem-length').value = length;
            document.getElementById('elem-angle').value = angleDeg;
            document.getElementById('elem-thickness').value = el.thickness;
            document.getElementById('elem-door-dir').value = el.doorDir || 'in-left';
            
            toggleElementOptions();
            document.getElementById('property-panel').style.display = 'block';
        }

        function toggleElementOptions() {
            const type = document.getElementById('elem-type').value;
            document.getElementById('group-door-dir').style.display = (type === 'door') ? 'block' : 'none';
        }

        function cancelElement() {
            document.getElementById('property-panel').style.display = 'none';
            startPoint = null;
            selectedElementIndex = null;
            draw2D();
        }

        function saveElement() {
            const type = document.getElementById('elem-type').value;
            const lengthCm = parseFloat(document.getElementById('elem-length').value) || 200;
            const angleDeg = parseFloat(document.getElementById('elem-angle').value) || 0;
            const thickness = parseFloat(document.getElementById('elem-thickness').value) || 20;
            const doorDir = document.getElementById('elem-door-dir').value;
            const angleRad = (angleDeg * Math.PI) / 180;

            lastUsedThickness = thickness; // Kalınlığı hafızaya al

            if (selectedElementIndex !== null) {
                // Mevcut elemanı güncelleme (Açı, ölçü ve kalınlık dahil)
                const el = elements[selectedElementIndex];
                el.type = type;
                el.thickness = thickness;
                el.doorDir = doorDir;
                // Başlangıç noktasını sabit tutarak yeni bitişi hesapla
                el.x2 = el.x1 + Math.cos(angleRad) * lengthCm;
                el.y2 = el.y1 + Math.sin(angleRad) * lengthCm;
                lastEndPoint = { x: el.x2, y: el.y2 };
            } else if (startPoint) {
                // Yeni eleman ekleme
                const x2 = startPoint.x + Math.cos(angleRad) * lengthCm;
                const y2 = startPoint.y + Math.sin(angleRad) * lengthCm;

                elements.push({
                    x1: startPoint.x, y1: startPoint.y,
                    x2: x2, y2: y2,
                    type: type, thickness: thickness, doorDir: doorDir
                });
                lastEndPoint = { x: x2, y: y2 };
            }

            document.getElementById('property-panel').style.display = 'none';
            startPoint = null;
            selectedElementIndex = null;
            draw2D();
        }

        function deleteSelectedElement() {
            if (selectedElementIndex !== null) {
                elements.splice(selectedElementIndex, 1);
                selectedElementIndex = null;
                document.getElementById('property-panel').style.display = 'none';
                draw2D();
            }
        }

        // --- 3D Three.js Motoru ---
        let scene, camera, renderer, controls;

        function init3D() {
            const container = document.getElementById('canvas3d-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x181818);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 5000);
            camera.position.set(0, 500, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(200, 500, 300);
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(2000, 50, 0x444444, 0x222222);
            gridHelper.position.y = -1;
            scene.add(gridHelper);

            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            controls.update();
            renderer.render(scene, camera);
        }

        function update3DScene() {
            const removeList = [];
            scene.children.forEach(child => {
                if (child.isMesh && !child.geometry.type.includes('Grid')) removeList.push(child);
            });
            removeList.forEach(c => scene.remove(c));

            if (elements.length === 0) return;

            // Yapının geometrik merkezini bularak 3D sahneyi otomatik ortalama
            let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
            elements.forEach(el => {
                minX = Math.min(minX, el.x1, el.x2);
                maxX = Math.max(maxX, el.x1, el.x2);
                minZ = Math.min(minZ, el.y1, el.y2);
                maxZ = Math.max(maxZ, el.y1, el.y2);
            });
            const centerX = (minX + maxX) / 2;
            const centerZ = (minZ + maxZ) / 2;

            elements.forEach(el => {
                // Merkezleme dönüşümü yap
                const x1 = el.x1 - centerX;
                const z1 = el.y1 - centerZ;
                const x2 = el.x2 - centerX;
                const z2 = el.y2 - centerZ;

                const length = Math.hypot(x2 - x1, z2 - z1);
                if (length === 0) return;

                const angle = Math.atan2(z2 - z1, x2 - x1);
                const wallHeight = 250;
                const thickness = el.thickness || 20;

                let color = 0x566573;
                let height = wallHeight;
                let yPos = wallHeight / 2;

                if (el.type === 'door') { color = 0xdc7633; height = 200; yPos = 100; }
                else if (el.type === 'window') { color = 0x5dade2; height = 100; yPos = 140; }
                else if (el.type === 'column') { color = 0xaf7ac5; }

                const geometry = new THREE.BoxGeometry(length, height, thickness);
                const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
                const mesh = new THREE.Mesh(geometry, material);

                mesh.position.set((x1 + x2) / 2, yPos, (z1 + z2) / 2);
                mesh.rotation.y = -angle;

                scene.add(mesh);
            });

            const container = document.getElementById('canvas3d-container');
            renderer.setSize(container.clientWidth, container.clientHeight);
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
        }
    </script>
</body>
</html>
