<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile2 Global - Efsun ve İtem Pazarı</title>
    <!-- Supabase JS Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #f43f5e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.5rem; color: var(--accent); }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        h2 { font-size: 1.2rem; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 10px; background: #0f172a; border: 1px solid var(--border); color: white; border-radius: 6px; font-size: 0.95rem; }
        button { background: var(--accent); color: #0f172a; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: var(--accent-hover); }
        .auth-box, .item-list { display: flex; flex-direction: column; gap: 5px; }
        .item-card { background: #090d16; border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .item-card h3 { color: var(--accent); font-size: 1.1rem; }
        .item-card p { font-size: 0.85rem; color: var(--text-muted); margin-top: 3px; }
        .badge { display: inline-block; background: #334155; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-right: 4px; margin-top: 4px; }
        .user-info { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-bottom: 10px; color: var(--text-muted); }
        .delete-btn { background: var(--danger); color: white; width: auto; padding: 5px 10px; font-size: 0.75rem; margin: 0; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Mobile2 Global Pazar</h1>
        <p style="font-size: 0.8rem; color: var(--text-muted);">Güvenli Efsun ve İtem Arama Sistemi</p>
    </header>

    <!-- ÜRÜN ARAMA VE FİLTRELEME -->
    <div class="card">
        <h2>🔍 İtem / Efsun Ara</h2>
        <input type="text" id="searchItemName" placeholder="İtem Adı (Örn: Siyah Çelik)">
        <input type="text" id="searchEfsun" placeholder="Aranan Efsun (Örn: Kılıç Savunması)">
        <button onclick="loadItems()">Filtrele ve Ara</button>
    </div>

    <!-- ÜYELİK ALANI -->
    <div class="card" id="authCard">
        <h2>👤 Hesap / Giriş</h2>
        <div id="loggedOutView">
            <input type="email" id="email" placeholder="E-posta Adresi">
            <input type="password" id="password" placeholder="Şifre">
            <div style="display: flex; gap: 10px;">
                <button onclick="signUp()">Kayıt Ol</button>
                <button onclick="signIn()" style="background: #10b981; color: white;">Giriş Yap</button>
            </div>
        </div>
        <div id="loggedInView" class="hidden">
            <div class="user-info">
                <span id="userEmailDisplay"></span>
                <button onclick="signOut()" style="background: var(--danger); color: white; width: auto; padding: 5px 10px; margin:0;">Çıkış Yap</button>
            </div>
        </div>
        <p id="authMsg" style="font-size: 0.8rem; margin-top: 5px; color: var(--accent);"></p>
    </div>

    <!-- İTEM EKLEME FORMU (Sadece Giriş Yapanlar Görebilir) -->
    <div class="card hidden" id="addItemCard">
        <h2>➕ İlan Ekle</h2>
        <input type="text" id="itemName" placeholder="İtem Adı (Örn: Muharebe Kılıcı +9)">
        <select id="itemCategory">
            <option value="Silah">Silah</option>
            <option value="Zırh">Zırh</option>
            <option value="Takı">Takı / Kalkan</option>
            <option value="Diğer">Diğer</option>
        </select>
        <input type="text" id="efsun1" placeholder="1. Efsun (Örn: Yarı İnsan +10)">
        <input type="text" id="efsun2" placeholder="2. Efsun (Örn: Delici Vuruş +10)">
        <input type="text" id="efsun3" placeholder="3. Efsun (Opsiyonel)">
        <input type="text" id="efsun4" placeholder="4. Efsun (Opsiyonel)">
        <input type="text" id="efsun5" placeholder="5. Efsun (Opsiyonel)">
        <input type="text" id="itemPrice" placeholder="Fiyat (Örn: 25 Won / 2 T)">
        <input type="text" id="sellerName" placeholder="Oyun İçi Karakter Adı">
        <input type="text" id="contactInfo" placeholder="İletişim (Discord / WhatsApp / Nick)">
        <button onclick="addItem()" style="background: #10b981; color: white;">İlanı Yayınla</button>
    </div>

    <!-- İTEMLERİN LİSTELENDİĞİ ALAN -->
    <div class="card">
        <h2>📜 Pazardaki İlanlar</h2>
        <div id="itemList" class="item-list">
            <p style="text-align: center; color: var(--text-muted);">İlanlar yükleniyor...</p>
        </div>
    </div>
</div>

<script>
    // --- SUPABASE BAĞLANTI BİLGİLERİNİZ ---
    const SUPABASE_URL = 'https://bgugtvlixerwlhrgqmfw.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_V11Gt6rJmKP90QQ4G7L-ag_1NpCea-i';
    
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    // Sayfa açıldığında oturumu ve ilanları kontrol et
    window.addEventListener('DOMContentLoaded', async () => {
        const { data: { session } } = await _supabase.auth.getSession();
        updateAuthUI(session);
        loadItems();
    });

    // Kayıt Ol
    async function signUp() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await _supabase.auth.signUp({ email, password });
        if (error) document.getElementById('authMsg').innerText = "Hata: " + error.message;
        else document.getElementById('authMsg').innerText = "Kayıt başarılı! E-postanızı kontrol edin veya giriş yapın.";
    }

    // Giriş Yap
    async function signIn() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) {
            document.getElementById('authMsg').innerText = "Giriş Hatası: " + error.message;
        } else {
            updateAuthUI(data.session);
            document.getElementById('authMsg').innerText = "Giriş başarılı!";
        }
    }

    // Çıkış Yap
    async function signOut() {
        await _supabase.auth.signOut();
        updateAuthUI(null);
    }

    // Arayüzü Giriş Durumuna Göre Güncelle
    function updateAuthUI(session) {
        currentUser = session ? session.user : null;
        if (currentUser) {
            document.getElementById('loggedOutView').classList.add('hidden');
            document.getElementById('loggedInView').classList.remove('hidden');
            document.getElementById('addItemCard').classList.remove('hidden');
            document.getElementById('userEmailDisplay').innerText = currentUser.email;
        } else {
            document.getElementById('loggedOutView').classList.remove('hidden');
            document.getElementById('loggedInView').classList.add('hidden');
            document.getElementById('addItemCard').classList.add('hidden');
        }
        loadItems();
    }

    // İlan Ekle
    async function addItem() {
        if (!currentUser) return alert("Önce giriş yapmalısınız!");

        const item_name = document.getElementById('itemName').value;
        const category = document.getElementById('itemCategory').value;
        const efsun_1 = document.getElementById('efsun1').value;
        const efsun_2 = document.getElementById('efsun2').value;
        const efsun_3 = document.getElementById('efsun3').value;
        const efsun_4 = document.getElementById('efsun4').value;
        const efsun_5 = document.getElementById('efsun5').value;
        const price = document.getElementById('itemPrice').value;
        const seller_name = document.getElementById('sellerName').value;
        const contact_info = document.getElementById('contactInfo').value;

        if (!item_name || !price || !seller_name) {
            alert("Lütfen İsim, Fiyat ve Karakter Adı alanlarını doldurun!");
            return;
        }

        const { error } = await _supabase.from('items').insert([{
            user_id: currentUser.id,
            item_name, category, efsun_1, efsun_2, efsun_3, efsun_4, efsun_5, price, seller_name, contact_info
        }]);

        if (error) {
            alert("İlan eklenirken hata oluştu: " + error.message);
        } else {
            alert("İlan başarıyla eklendi!");
            document.getElementById('itemName').value = '';
            document.getElementById('efsun1').value = '';
            document.getElementById('efsun2').value = '';
            document.getElementById('efsun3').value = '';
            document.getElementById('efsun4').value = '';
            document.getElementById('efsun5').value = '';
            document.getElementById('itemPrice').value = '';
            loadItems();
        }
    }

    // İlanları Listele ve Filtrele
    async function loadItems() {
        const searchName = document.getElementById('searchItemName').value.toLowerCase();
        const searchEfsun = document.getElementById('searchEfsun').value.toLowerCase();

        let query = _supabase.from('items').select('*').order('created_at', { ascending: false });

        const { data: items, error } = await query;
        const listDiv = document.getElementById('itemList');

        if (error) {
            listDiv.innerHTML = '<p style="color:var(--danger);">İlanlar yüklenirken hata oluştu.</p>';
            return;
        }

        if (!items || items.length === 0) {
            listDiv.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Henüz hiç ilan eklenmemiş.</p>';
            return;
        }

        // Filtreleme mantığı
        let filtered = items.filter(item => {
            const matchesName = item.item_name.toLowerCase().includes(searchName);
            const efsunlarText = `${item.efsun_1 || ''} ${item.efsun_2 || ''} ${item.efsun_3 || ''} ${item.efsun_4 || ''} ${item.efsun_5 || ''}`.toLowerCase();
            const matchesEfsun = efsunlarText.includes(searchEfsun);
            return matchesName && matchesEfsun;
        });

        if (filtered.length === 0) {
            listDiv.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Aradığınız kriterlere uygun item bulunamadı.</p>';
            return;
        }

        listDiv.innerHTML = '';
        filtered.forEach(item => {
            let efsunlarHTML = '';
            [item.efsun_1, item.efsun_2, item.efsun_3, item.efsun_4, item.efsun_5].forEach(e => {
                if(e) efsunlarHTML += `<span class="badge">${e}</span>`;
            });

            let deleteBtnHTML = '';
            if (currentUser && currentUser.id === item.user_id) {
                deleteBtnHTML = `<button class="delete-btn" onclick="deleteItem(${item.id})">İlanı Sil</button>`;
            }

            listDiv.innerHTML += `
                <div class="item-card">
                    <h3>${item.item_name} <span style="font-size:0.75rem; color:var(--text-muted);">(${item.category})</span></h3>
                    <div style="margin: 5px 0;">${efsunlarHTML}</div>
                    <p><b>Fiyat:</b> <span style="color:#10b981; font-weight:bold;">${item.price}</span></p>
                    <p><b>Satıcı:</b> ${item.seller_name} | <b>İletişim:</b> ${item.contact_info}</p>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
                        <span style="font-size: 0.7rem; color: var(--text-muted);">${new Date(item.created_at).toLocaleDateString()}</span>
                        ${deleteBtnHTML}
                    </div>
                </div>
            `;
        });
    }

    // İlan Silme
    async function deleteItem(id) {
        if(!confirm("Bu ilanı silmek istediğinize emin misiniz?")) return;
        const { error } = await _supabase.from('items').delete().eq('id', id);
        if(error) alert("Silme hatası: " + error.message);
        else loadItems();
    }
</script>

</body>
</html>
