<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Parke Hassas Kesim ve Yerleşim Hesabı</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 15px;
      background: #eef0f2;
      color: #263238;
    }
    h2, h3 { color: #263238; margin-bottom: 10px; }
    .panel {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }
    .form-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .form-group label {
      flex: 1 1 220px;
      font-size: 14px;
      font-weight: 600;
      color: #37474f;
    }
    .form-group input, .form-group select {
      flex: 2 1 150px;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #cfd8dc;
      border-radius: 4px;
    }
    .sub-inputs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      flex: 2 1 150px;
    }
    .sub-inputs input {
      width: 100%;
      padding: 6px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .hint {
      font-size: 12px;
      color: #78909c;
      flex-basis: 100%;
      margin-top: -4px;
    }
    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background-color: #2f6b5e;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #234f45; }
    button.secondary { background-color: #5b6470; }
    button.secondary:hover { background-color: #40474f; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }
    .canvas-wrapper {
      overflow: auto;
      max-width: 100%;
      border: 1px solid #37474f;
      border-radius: 6px;
      background: #cfd8dc;
      margin-bottom: 15px;
    }
    #canvas { display: block; }
    #stats {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      line-height: 1.6;
      margin-bottom: 15px;
    }
    .table-container {
      background: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    th, td {
      padding: 8px 12px;
      border-bottom: 1px solid #cfd8dc;
    }
    th {
      background-color: #f0f4f8;
      color: #37474f;
      font-weight: 600;
    }
    tr:nth-child(even) { background-color: #fafafa; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-cut { background: #ffe0b2; color: #e65100; }
  </style>
</head>
<body>

  <h2>Parke Açılı Kesim ve Yerleşim Simülatörü</h2>

  <div class="panel">
    <div class="form-group">
      <label>Oda Yüksekliği / Boyu (cm):</label>
      <input type="number" id="roomHeight" value="200" />
      <div class="hint">Yukarıdan aşağıya odanın toplam boyu.</div>
    </div>

    <div class="form-group">
      <label>Sağ Duvar Ölçüleri (6 Nokta - Üstten Alta cm):</label>
      <div class="sub-inputs">
        <input type="number" id="r1" value="460" title="1. Nokta (En Üst)">
        <input type="number" id="r2" value="459.4" title="2. Nokta">
        <input type="number" id="r3" value="458.8" title="3. Nokta">
        <input type="number" id="r4" value="458.2" title="4. Nokta">
        <input type="number" id="r5" value="457.6" title="5. Nokta">
        <input type="number" id="r6" value="457.0" title="6. Nokta (En Alt)">
      </div>
      <div class="hint">Sağ üstten (460 cm) sağ alta (457 cm) doğru kademeli genişlikler.</div>
    </div>

    <div class="form-group"><label>Parke Plaka Boyu (cm):</label><input type="number" id="tileLength" value="120" /></div>
    <div class="form-group"><label>Parke Plaka Eni (cm):</label><input type="number" id="tileHeight" value="20" /></div>
    <div class="form-group"><label>Duvar Genleşme Payı (cm):</label><input type="number" id="margin" value="1.0" step="0.1" /></div>
    <div class="form-group"><label>Testere Bıçak Payı (cm):</label><input type="number" id="cutLoss" value="0.3" step="0.1" /></div>
    <div class="form-group"><label>Minimum Kullanılabilir Parça Boyu (cm):</label><input type="number" id="minLength" value="20" /></div>
  </div>

  <div class="toolbar">
    <button onclick="calculateAndDraw()">Yerleşimi Hesabla & Kesim Listesi Oluştur</button>
  </div>

  <div class="canvas-wrapper">
    <canvas id="canvas"></canvas>
  </div>

  <div id="stats"></div>

  <div class="table-container">
    <h3>Her Bir Sıra İçin En Sağ Parça Kesim Listesi</h3>
    <table>
      <thead>
        <tr>
          <th>Sıra No</th>
          <th>Sıradaki Parça Sayısı</th>
          <th>Sol Parçalar (Düz)</th>
          <th>Son Parça Üst Kenar</th>
          <th>Son Parça Alt Kenar</th>
          <th>Fark / Açı Durumu</th>
        </tr>
      </thead>
      <tbody id="cutTableBody">
      </tbody>
    </table>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function getInputs() {
      return {
        roomHeight: +document.getElementById("roomHeight").value,
        rightWall: [
          +document.getElementById("r1").value,
          +document.getElementById("r2").value,
          +document.getElementById("r3").value,
          +document.getElementById("r4").value,
          +document.getElementById("r5").value,
          +document.getElementById("r6").value
        ],
        tileLength: +document.getElementById("tileLength").value,
        tileHeight: +document.getElementById("tileHeight").value,
        margin: +document.getElementById("margin").value,
        cutLoss: +document.getElementById("cutLoss").value,
        minLength: +document.getElementById("minLength").value
      };
    }

    // Y yüksekliğindeki net duvar genişliğini hesaplar
    function getRightWallWidthAtY(y, roomHeight, rightWall) {
      let ratio = y / roomHeight;
      if (ratio < 0) ratio = 0;
      if (ratio > 1) ratio = 1;
      
      let indexFloat = ratio * 5;
      let idx1 = Math.floor(indexFloat);
      let idx2 = Math.min(5, Math.ceil(indexFloat));
      let t = indexFloat - idx1;

      return rightWall[idx1] + (rightWall[idx2] - rightWall[idx1]) * t;
    }

    function calculateAndDraw() {
      const v = getInputs();
      const tableBody = document.getElementById("cutTableBody");
      tableBody.innerHTML = "";

      let currentY = v.margin; // Sol ve Üst duvardan 1 cm boşluk
      let rowIdx = 1;
      let leftoverFromPrevious = 0; // Bir önceki sıradan artan parça

      let totalFullTiles = 0;
      let totalCutTiles = 0;
      let totalBoardsUsed = 0;

      let drawCommands = [];
      let rowReports = [];

      const maxRoomWidth = Math.max(...v.rightWall);

      while (currentY + v.tileHeight <= v.roomHeight - v.margin + 0.001) {
        let yTop = currentY;
        let yBottom = currentY + v.tileHeight;

        // Bu sıranın üst ve alt kenarında duvara olan net kullanılabilir genişlikler (1 cm sol + 1 cm sağ pay düşülmüş)
        let availableWidthTop = getRightWallWidthAtY(yTop, v.roomHeight, v.rightWall) - (v.margin * 2);
        let availableWidthBottom = getRightWallWidthAtY(yBottom, v.roomHeight, v.rightWall) - (v.margin * 2);

        let currentX = v.margin;
        let rowTiles = [];

        // 1. Sıra Başı Artık Parça Kullanımı
        if (leftoverFromPrevious >= v.minLength) {
          let pieceLen = leftoverFromPrevious;
          rowTiles.push({ x: currentX, wTop: pieceLen, wBottom: pieceLen, isStartCut: true });
          currentX += pieceLen;
          leftoverFromPrevious = 0;
          totalCutTiles++;
        }

        // 2. Tam Boy Parkeler
        // Son parçaya yer kalsın diye mevcut X sınırına göre tam boy dizeriz
        let minAvailableWidth = Math.min(availableWidthTop, availableWidthBottom);
        while (currentX + v.tileLength < minAvailableWidth + v.margin) {
          rowTiles.push({ x: currentX, wTop: v.tileLength, wBottom: v.tileLength, isFull: true });
          currentX += v.tileLength;
          totalFullTiles++;
        }

        // 3. En Sağdaki Açılı Kesilecek Son Parça
        let xOffsetFromMargin = currentX - v.margin;
        let lastPieceTop = availableWidthTop - xOffsetFromMargin;
        let lastPieceBottom = availableWidthBottom - xOffsetFromMargin;

        rowTiles.push({
          x: currentX,
          wTop: lastPieceTop,
          wBottom: lastPieceBottom,
          isRightCut: true
        });
        totalCutTiles++;
        totalBoardsUsed++;

        // Son parçanın fire/artık hesabı (Tam boy plakadan kesildiği varsayılır)
        let avgCutLen = (lastPieceTop + lastPieceBottom) / 2;
        let remainingFromBoard = v.tileLength - avgCutLen - v.cutLoss;
        if (remainingFromBoard >= v.minLength) {
          leftoverFromPrevious = remainingFromBoard;
        } else {
          leftoverFromPrevious = 0;
        }

        // Çizim Komutlarına Ekle
        drawCommands.push({ yTop, yBottom, tiles: rowTiles, height: v.tileHeight });

        // Tablo Raporuna Ekle
        let diff = lastPieceBottom - lastPieceTop;
        let diffText = Math.abs(diff) < 0.05 
          ? "Düz Kesim ($90^\\circ$)" 
          : (diff > 0 ? `Alt kenar ${Math.abs(diff*10).toFixed(1)} mm daha UZUN` : `Alt kenar ${Math.abs(diff*10).toFixed(1)} mm daha KISA`);

        rowReports.push({
          row: rowIdx,
          tileCount: rowTiles.length,
          fullTilesCount: rowTiles.filter(t => t.isFull || t.isStartCut).length,
          topLen: lastPieceTop.toFixed(1),
          bottomLen: lastPieceBottom.toFixed(1),
          diffText: diffText
        });

        currentY += v.tileHeight;
        rowIdx++;
      }

      // Tuvale Çiz (Canvas)
      renderCanvas(drawCommands, maxRoomWidth, v.roomHeight);

      // İstatistikleri Güncelle
      document.getElementById("stats").innerHTML = `
        <strong>Toplam Sıra Sayısı:</strong> ${rowIdx - 1} sıra<br>
        <strong>Kullanılan Toplam Plaka (Tahta):</strong> ${totalFullTiles + totalBoardsUsed} adet<br>
        <strong>Sıra Sonu Açılı Kesilen Parça:</strong> ${rowIdx - 1} adet
      `;

      // Tabloyu Doldur
      rowReports.forEach(r => {
        let tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>Sıra ${r.row}</strong></td>
          <td>${r.tileCount} Parça</td>
          <td>${r.fullTilesCount} adet düz dizildi</td>
          <td><strong>${r.topLen} cm</strong></td>
          <td><strong>${r.bottomLen} cm</strong></td>
          <td><span class="badge badge-cut">${r.diffText}</span></td>
        `;
        tableBody.appendChild(tr);
      });
    }

    function renderCanvas(drawCommands, roomWidth, roomHeight) {
      const scale = 2.5; // 1 cm = 2.5 px
      canvas.width = roomWidth * scale;
      canvas.height = roomHeight * scale;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fdfaf5";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawCommands.forEach(cmd => {
        cmd.tiles.forEach(t => {
          let x1 = t.x * scale;
          let y1 = cmd.yTop * scale;
          let y2 = cmd.yBottom * scale;

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x1 + t.wTop * scale, y1);
          ctx.lineTo(x1 + t.wBottom * scale, y2);
          ctx.lineTo(x1, y2);
          ctx.closePath();

          if (t.isRightCut) {
            ctx.fillStyle = "#e8c894";
            ctx.strokeStyle = "#8a5a2b";
          } else if (t.isStartCut) {
            ctx.fillStyle = "#f0d3a0";
            ctx.strokeStyle = "#a87b45";
          } else {
            ctx.fillStyle = "#c9a06c";
            ctx.strokeStyle = "#6b4423";
          }

          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Ölçü Metni
          let avgW = (t.wTop + t.wBottom) / 2;
          if (avgW * scale > 35) {
            ctx.fillStyle = "#2b1c0e";
            ctx.font = "11px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            let label = t.isRightCut ? `${t.wTop.toFixed(1)}/${t.wBottom.toFixed(1)}` : `${avgW.toFixed(0)}cm`;
            ctx.fillText(label, x1 + (avgW * scale) / 2, y1 + (cmd.height * scale) / 2);
          }
        });
      });
    }

    // İlk açılışta çalıştır
    calculateAndDraw();
  </script>
</body>
</html>
